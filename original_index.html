<html lang="ru">
<head>
  <meta charset="UTF-8">

  <script>
    window.Telegram = window.Telegram || {};
    window.Telegram.WebApp = window.Telegram.WebApp || {
      ready: () => {}, expand: () => {}, user: { id: 0, first_name: 'Player', username: 'user' },
      themeParams: { bg_color: '#0a0a1a', text_color: '#ffffff', accent_text_color: '#ff5588' }

  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background: linear-gradient(135deg, #0a0a1a, #120f2a);
      color: #e0e6ff;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo {
      font-weight: 800;
      font-size: 28px;
      background: linear-gradient(90deg, #ff5588, #00d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .user {
      font-size: 14px;
      color: #aaa;
      text-align: right;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 6px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #ff5588, #ff2266);
      color: white;
    }

    /* Balance */
    .balance-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 85, 136, 0.2);
    }
    .balance-label {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .balance-value {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #ffd700, #ffaa00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Game */
    .game-card {
      background: rgba(10, 10, 30, 0.7);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .game-header {
      background: rgba(0, 0, 0, 0.3);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #00d4ff;
    }

    .graph-area {
      height: 300px;
      background: #080818;
      position: relative;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .rocket {
      position: absolute;
      font-size: 28px;
      z-index: 10;
      transition: transform 0.1s;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
    }
    .flame {
      position: absolute;
      font-size: 16px;
      color: #ff5500;
      animation: flame 0.1s infinite alternate;
    }
    @keyframes flame {
      from { opacity: 0.7; transform: translateX(-50%) scale(1); }
      to { opacity: 1; transform: translateX(-50%) scale(1.15, 1.4); }
    }

    /* Controls */
    .controls {
      padding: 20px;
    }
    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }
    .input-group {
      flex: 1;
    }
    .label {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 85, 136, 0.3);
      border-radius: 14px;
      color: white;
      font-size: 18px;
      outline: none;
      font-weight: 600;
    }
    input:focus {
      border-color: #ff5588;
      box-shadow: 0 0 0 3px rgba(255, 85, 136, 0.2);
    }

    /* Cashout button */
    .cashout-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #ff5588, #ff2266);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 6px 20px rgba(255, 85, 136, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .cashout-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 85, 136, 0.6);
    }
    .cashout-btn:active {
      transform: translateY(1px);
    }
    .cashout-btn:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
    }
    .cashout-icon {
      font-size: 24px;
    }

    .status {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-top: 20px;
      min-height: 32px;
      color: #00d4ff;
    }
    .status.win { color: #00ffaa; }
    .status.lose { color: #ff5555; }

    /* Clicker */
    .clicker-card {
      background: rgba(10, 20, 40, 0.7);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .click-target {
      width: 180px;
      height: 180px;
      margin: 0 auto 24px;
      background: radial-gradient(circle, #ff5588, #ff2266);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 30px rgba(255, 85, 136, 0.5);
      transition: transform 0.1s;
    }
    .click-target:active {
      transform: scale(0.95);
    }
    .click-value {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .upgrades {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
    }
    .upgrade-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
    }
    .upgrade-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #00d4ff;
    }
    .upgrade-cost {
      font-size: 14px;
      color: #ffd700;
    }
    .upgrade-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: rgba(255, 85, 136, 0.2);
      border: 1px solid rgba(255, 85, 136, 0.3);
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    .upgrade-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Telegram button */
    .tg-btn {
      background: linear-gradient(135deg, #0088cc, #00aaff);
      color: white;
      padding: 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 18px;
      text-align: center;
      cursor: pointer;
      margin: 20px auto;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 6px 20px rgba(0, 136, 204, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    footer {
      text-align: center;
      padding: 20px 0 10px;
      color: #667;
      font-size: 14px;
    }
    footer a { color: #ff5588; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">🚀 Cosmic</div>

    </div>

    <div class="balance-card">
      <div class="balance-label">БАЛАНС</div>
      <div class="balance-value" id="balance">1 000 ₽</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="crash">🚀 Crash</div>
      <div class="tab" data-tab="clicker">🖱️ Кликер</div>
    </div>

    <!-- CRASH PANEL -->
    <div class="panel active" id="crash-panel">
      <div class="game-card">
        <div class="game-header">
          <div class="title">CRASH</div>
          <div class="stat-value" id="online-count">1 247</div>

        <div class="controls">

    <!-- CLICKER PANEL -->
    <div class="panel" id="clicker-panel">
      <div class="clicker-card">
        <div class="click-value">За клик: <span id="per-click">1</span> ₽</div>
        <div class="click-target" id="click-btn">🪙</div>
        <div>Всего заработано: <span id="total-earned">0</span> ₽</div>

        <div class="upgrades">
          <div class="upgrade-card">
            <div class="upgrade-title">Авто-клик</div>
            <div>Скорость: <span id="auto-speed">0</span>/сек</div>
            <div class="upgrade-cost">Стоимость: <span id="auto-cost">500</span> ₽</div>
            <button class="upgrade-btn" id="buy-auto">Улучшить</button>
          </div>
          <div class="upgrade-card">
            <div class="upgrade-title">Множитель</div>
            <div>Множитель: <span id="multiplier">1</span></div>

    <div class="tg-btn" id="tg-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
        <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM16.59 7.58L15.17 6.16L12 9.33L8.83 6.16L7.41 7.58L12 12.17L16.59 7.58Z"/>
      </svg>
      Играть в Telegram
    </div>

    <footer>

  </div>

  <script>
    // === CONFIG ===
    const BOT_USERNAME = 'casinoslavik_bot'; // ← ЗАМЕНИ НА СВОЁ

    // === TELEGRAM INIT ===
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    const tgUser = Telegram.WebApp.initDataUnsafe.user || {};
    const userId = tgUser.id || Date.now();
    const firstName = tgUser.first_name || 'Player';
    const username = tgUser.username || 'user';
    
    document.getElementById('user-info').textContent = `👤 ${firstName}`;
    
    const theme = Telegram.WebApp.themeParams;
    document.body.style.background = `linear-gradient(135deg, ${theme.bg_color || '#0a0a1a'}, #120f2a)`;

    // === GAME STATE ===
    let balance = parseFloat(localStorage.getItem(`balance_${userId}`)) || 1000;
    let active = false;
    let coef = 1.00;
    let targetCrashPoint = 1.00;
    let startTime = 0;
    let bestCoef = 8.77;

    // === CLICKER STATE ===
    let perClick = 1;
    let autoSpeed = 0;
    let multiplier = 1;
    let totalEarned = 0;
    let lastAuto = Date.now();

    // DOM
    const els = {
      balance: document.getElementById('balance'),
      bet: document.getElementById('bet'),
      auto: document.getElementById('auto'),
      playBtn: document.getElementById('play-btn'),
      status: document.getElementById('status'),
      rocket: document.getElementById('rocket'),
      graph: document.getElementById('graph'),
      btnText: document.getElementById('btn-text'),
      onlineCount: document.getElementById('online-count'),
      tabs: document.querySelectorAll('.tab'),
      panels: document.querySelectorAll('.panel'),
      clickBtn: document.getElementById('click-btn'),
      perClick: document.getElementById('per-click'),
      totalEarned: document.getElementById('total-earned'),
      autoSpeed: document.getElementById('auto-speed'),
      autoCost: document.getElementById('auto-cost'),
      mult: document.getElementById('multiplier'),
      multCost: document.getElementById('mult-cost'),
      buyAuto: document.getElementById('buy-auto'),
      buyMult: document.getElementById('buy-mult'),
      tgBtn: document.getElementById('tg-btn')
    };

    // Save state
    function saveState() {
      localStorage.setItem(`balance_${userId}`, balance);
      localStorage.setItem(`clicker_${userId}`, JSON.stringify({
        perClick, autoSpeed, multiplier, totalEarned
      }));
    }

    function updateBalance() {
      els.balance.textContent = balance.toLocaleString('ru') + ' ₽';
      els.playBtn.disabled = balance < 10;
      saveState();
    }

    // === CRASH GAME ===
    const canvas = els.graph;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    function sound(type) {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const now = ac.currentTime;
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.connect(g);
        g.connect(ac.destination);
        o.frequency.value = type === 'win' ? 900 : type === 'lose' ? 200 : 700;
        g.gain.value = 0.07;
        o.type = 'sine';
        o.start(now);
        o.stop(now + (type === 'lose' ? 0.25 : 0.12));
      } catch (e) {}
    }

    function drawGraph() {
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);

      const gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, '#0a0a2a');
      gradient.addColorStop(1, '#050515');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);

      // Stars
      ctx.fillStyle = 'white';
      for (let i = 0; i < 50; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = Math.random() * 1.5;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Trajectory
      if (active) {
        ctx.strokeStyle = 'rgba(0, 212, 255, 0.5)';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 5]);
        ctx.beginPath();
        ctx.moveTo(40, h - 40);
        const t = (performance.now() - startTime) / 1000;
        const c = 1 + Math.pow(t, 1.5);
        const x = 40 + Math.min(1, (c - 1) / 20) * (w - 80);
        const y = h - 40 - Math.min(1, (c - 1) / 20) * (h - 80);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function animateRocket() {
      if (!active) return;

      const t = (performance.now() - startTime) / 1000;
      coef = 1 + Math.pow(t, 1.5);

      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      const progress = Math.min(1, (coef - 1) / 20);
      const x = 40 + progress * (w - 80);
      const y = h - 40 - progress * (h - 80);
      
      els.rocket.style.left = `${x}px`;
      els.rocket.style.bottom = `${y - 14}px`;
      els.rocket.style.transform = `translateX(-50%) rotate(${progress * 15}deg)`;

      const auto = parseFloat(els.auto.value) || 2.50;
      if (parseFloat(els.auto.value) > 1.00 && coef >= auto) {
        stopRound(true, auto);
        return;
      }

      if (coef >= targetCrashPoint) {
        stopRound(false);
        return;
      }

      els.status.textContent = `x${coef.toFixed(2)}`;
      drawGraph();

      requestAnimationFrame(animateRocket);
    }

    function explode() {
      sound('lose');
      els.rocket.innerHTML = '💥';
      setTimeout(() => {
        els.rocket.innerHTML = '🚀<div class="flame">🔥</div>';
        els.rocket.style.transform = 'translateX(-50%)';
      }, 500);
    }

    function startRound() {
      const bet = parseFloat(els.bet.value) || 0;
      if (bet < 10 || bet > balance) {
        els.status.textContent = 'Мин. ставка: 10 ₽';
        els.status.className = 'status lose';
        return;
      }

      balance -= bet;
      updateBalance();

      active = true;
      coef = 1.00;
      startTime = performance.now();
      targetCrashPoint = 1.00 + Math.pow(Math.random(), 2.0) * 5;
      bestCoef = Math.max(bestCoef, targetCrashPoint);

      els.btnText.textContent = '🪂 КЭШАУТ';
      els.playBtn.style.background = 'linear-gradient(135deg, #00d4ff, #00aaff)';
      els.playBtn.style.boxShadow = '0 6px 20px rgba(0, 212, 255, 0.4)';
      els.status.textContent = 'x1.00';
      els.status.className = '';

      sound('start');
      drawGraph();
      requestAnimationFrame(animateRocket);
    }

    function stopRound(won = true, cashout = null) {
      active = false;
      const finalCoef = cashout || (won ? coef : targetCrashPoint);
      const bet = parseFloat(els.bet.value);

      if (won) {
        const win = Math.floor(bet * finalCoef);
        balance += win;
        els.status.textContent = `+${win.toLocaleString('ru')} ₽`;
        els.status.className = 'status win';
        sound('win');
      } else {
        explode();
        els.status.textContent = `Взрыв на x${finalCoef.toFixed(2)}`;
        els.status.className = 'status lose';
      }

      updateBalance();
      
      setTimeout(() => {
        els.rocket.style.left = '40px';
        els.rocket.style.bottom = '20px';
        els.rocket.style.transform = 'translateX(-50%)';
        els.btnText.textContent = 'СТАРТ';
        els.playBtn.style.background = 'linear-gradient(135deg, #ff5588, #ff2266)';
        els.playBtn.style.boxShadow = '0 6px 20px rgba(255, 85, 136, 0.4)';
        els.status.textContent = 'Готов к старту';
        els.status.className = '';
      }, 1800);
    }

    // === CLICKER ===
    function loadClicker() {
      const saved = localStorage.getItem(`clicker_${userId}`);
      if (saved) {
        const data = JSON.parse(saved);
        perClick = data.perClick || 1;
        autoSpeed = data.autoSpeed || 0;
        multiplier = data.multiplier || 1;
        totalEarned = data.totalEarned || 0;
      }
      updateClickerUI();
    }

    function updateClickerUI() {
      els.perClick.textContent = perClick * multiplier;
      els.totalEarned.textContent = totalEarned.toLocaleString('ru');
      els.autoSpeed.textContent = autoSpeed.toFixed(1);
      els.mult.textContent = multiplier;
      els.autoCost.textContent = Math.floor(500 * Math.pow(1.5, autoSpeed)).toLocaleString('ru');
      els.multCost.textContent = Math.floor(200 * Math.pow(1.8, multiplier - 1)).toLocaleString('ru');
      
      els.buyAuto.disabled = balance < parseFloat(els.autoCost.textContent.replace(/\s/g, ''));
      els.buyMult.disabled = balance < parseFloat(els.multCost.textContent.replace(/\s/g, ''));
    }

    function click() {
      const earn = perClick * multiplier;
      balance += earn;
      totalEarned += earn;
      updateBalance();
      updateClickerUI();
      
      // Animation
      els.clickBtn.style.transform = 'scale(0.9)';
      setTimeout(() => els.clickBtn.style.transform = 'scale(1)', 100);
    }

    function buyAuto() {
      const cost = parseFloat(els.autoCost.textContent.replace(/\s/g, ''));
      if (balance >= cost) {
        balance -= cost;
        autoSpeed += 0.5;
        updateBalance();
        updateClickerUI();
      }
    }

    function buyMult() {
      const cost = parseFloat(els.multCost.textContent.replace(/\s/g, ''));
      if (balance >= cost) {
        balance -= cost;
        multiplier += 1;
        updateBalance();
        updateClickerUI();
      }
    }

    // Auto-click loop
    setInterval(() => {
      if (autoSpeed > 0) {
        const earn = perClick * multiplier * autoSpeed * 0.1;
        balance += earn;
        totalEarned += earn;
        updateBalance();
      }
    }, 100);

    // === TABS ===
    els.tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        els.tabs.forEach(t => t.classList.remove('active'));
        els.panels.forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + '-panel').classList.add('active');
      });
    });

    // === INIT ===
    els.playBtn.onclick = () => active ? stopRound(true) : startRound();
    els.clickBtn.onclick = click;
    els.buyAuto.onclick = buyAuto;
    els.buyMult.onclick = buyMult;

    // Online counter
    let online = 1200 + Math.floor(Math.random() * 300);
    setInterval(() => {
      online += Math.floor(Math.random() * 10) - 4;
      online = Math.max(800, Math.min(2500, online));
      els.onlineCount.textContent = online.toLocaleString('ru');
    }, 4000);

    // Telegram button
    els.tgBtn.onclick = () => {
      const url = encodeURIComponent(window.location.href);
      const tgUrl = `https://t.me/${BOT_USERNAME}/app?startapp=crash&url=${url}`;
      if (Telegram.WebApp.initData) {
        Telegram.WebApp.openTelegramLink(tgUrl);
      } else {
        window.open(tgUrl, '_blank');
      }
    };

    if (Telegram.WebApp.initData) {
      els.tgBtn.style.display = 'none';
    }

    updateBalance();
    loadClicker();
    drawGraph();
  </script>
</body>
</html>
